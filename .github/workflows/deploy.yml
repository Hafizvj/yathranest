name: Deploy to HostMaria (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # HostMaria resets FTP-Deploy-Action's FTPS data connections (ECONNRESET);
      # lftp retries each transfer instead of aborting the whole deploy.
      # The FTP account must open in the site root (public_html/yathranest_v3).
      - name: Deploy changed files via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: bash .github/scripts/ftp-deploy.sh
